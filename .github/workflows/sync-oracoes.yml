name: Sync Oracoes Diárias

on:
  schedule:
    # Roda todos os dias às 00:30 (meia-noite e meia - UTC)
    # Para Brasília (UTC-3), seria 21:30 do dia anterior
    # Ajuste conforme necessário:
    # '30 0 * * *' = 00:30 UTC
    # '30 3 * * *' = 03:30 UTC (00:30 Brasília no horário de verão)
    - cron: '30 3 * * *'

  # Permite manual trigger via GitHub Actions UI
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔑 Create credentials file
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          echo "$GOOGLE_CREDENTIALS" > jornadacomdeus-ce9c0e55fc3e.json

      - name: 🚀 Sync oracoes from Google Sheets
        run: npm run sync:oracoes

      - name: 📝 Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Commit and push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "bot@jornadacomdeus.app"
          git config --local user.name "Jornada Bot"

          git add src/data/oracoes.ts public/data/oracoes.json .image-state.json

          git commit -m "chore(oracoes): sincronizar orações diárias do Google Sheets

          - Fetched oracoes from Google Sheets API
          - Processed and cleaned data
          - Mapped images without repetition
          - Updated TypeScript and JSON data files

          [skip ci]"

          git push

      - name: ✨ Success notification
        if: success()
        run: |
          echo "✅ Sincronização de orações concluída com sucesso!"
          echo "📊 Total de orações: $(grep -o '"id":' src/data/oracoes.ts | wc -l)"

      - name: ❌ Failure notification
        if: failure()
        run: |
          echo "❌ Erro na sincronização de orações"
          echo "Verifique os logs acima para mais detalhes"
          exit 1
